<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site bloqueado | Blocksite</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #172033;
      background: #f3f6fb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 520px);
      padding: 42px;
      border: 1px solid #e1e7f0;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 20px 60px #25365a18;
      text-align: center;
    }
    .icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: #fff0ed;
      color: #d34235;
      font-size: 34px;
      font-weight: 700;
    }
    .brand {
      color: #3156a6;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 { margin: 12px 0; font-size: 30px; }
    p { margin: 0; color: #5d687c; line-height: 1.65; }
    .site {
      display: inline-block;
      max-width: 100%;
      margin-top: 20px;
      padding: 10px 16px;
      overflow-wrap: anywhere;
      border-radius: 10px;
      background: #f3f6fb;
      color: #263b67;
      font-weight: 600;
    }
    .hint { margin-top: 22px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">!</div>
    <div class="brand">Blocksite</div>
    <h1>Este site está bloqueado</h1>
    <p>O acesso a este endereço foi restringido pelas regras configuradas neste computador.</p>
    <div class="site">{{BLOCKED_SITE}}</div>
    <p class="hint">Se você acredita que isso aconteceu por engano, fale com a pessoa responsável pelas configurações.</p>
  </main>
</body>
</html>
